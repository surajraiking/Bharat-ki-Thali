name: Android APK & AAB

on:
  push:
    branches:
      - main
      - feature/bharat-ki-thali-2.0
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare branded PWA and Android icon assets
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p resources
          rsvg-convert -w 512 -h 512 public/icon.svg -o public/pwa-512x512.png
          rsvg-convert -w 192 -h 192 public/icon.svg -o public/pwa-192x192.png
          rsvg-convert -w 512 -h 512 public/icon.svg -o public/pwa-maskable-512x512.png
          rsvg-convert -w 180 -h 180 public/icon.svg -o public/apple-touch-icon.png
          rsvg-convert -w 1024 -h 1024 public/icon.svg -o resources/icon.png

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Normalize strict TypeScript collection types
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/context/AppContext.tsx')
          s = p.read_text()
          s = s.replace(
              'Object.values(mealPlan).forEach(day => {',
              'Object.values(mealPlan as WeeklyMealPlan).forEach(day => {'
          )
          p.write_text(s)

          p = Path('src/pages/ThaliBuilderPage.tsx')
          s = p.read_text()
          s = s.replace(
              'Object.values(currentThali).forEach(dishId => {',
              '(Object.values(currentThali) as (string | undefined)[]).forEach(dishId => {'
          )
          s = s.replace(
              'Object.values(currentThali).reduce((acc, dishId) => {',
              '(Object.values(currentThali) as (string | undefined)[]).reduce((acc, dishId) => {'
          )
          p.write_text(s)
          PY

      - name: TypeScript check
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Generate native Android branding
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#173B2F' --iconBackgroundColorDark '#0F2A22'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build debug AAB
        working-directory: android
        run: ./gradlew bundleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bharat-ki-thali-2.0-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: bharat-ki-thali-2.0-debug-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14
