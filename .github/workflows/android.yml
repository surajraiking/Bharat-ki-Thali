name: Bharat Ki Thali Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'android-v*'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK and release APK/AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease

      - name: Collect Android outputs
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Bharat-Ki-Thali-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk release/Bharat-Ki-Thali-release-unsigned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/Bharat-Ki-Thali-release-unsigned.aab

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Bharat-Ki-Thali-Android
          path: release/*
          if-no-files-found: error
          retention-days: 30
