name: Bharat Ki Thali Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SVG rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Generate app icons from master SVG
        run: |
          mkdir -p resources
          rsvg-convert -w 1024 -h 1024 public/icon.svg -o resources/icon.png
          rsvg-convert -w 512 -h 512 public/icon.svg -o public/icon-512.png
          rsvg-convert -w 192 -h 192 public/icon.svg -o public/icon-192.png
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Generate native Android launcher icons
        run: npx @capacitor/assets generate --android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK and release APK/AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease
      - name: Collect Android outputs
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Bharat-Ki-Thali.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Bharat-Ki-Thali-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk release/Bharat-Ki-Thali-release-unsigned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/Bharat-Ki-Thali-release-unsigned.aab
      - name: Upload APK and AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bharat-Ki-Thali-Android
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest APK to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest release/Bharat-Ki-Thali.apk --clobber
          else
            gh release create android-latest release/Bharat-Ki-Thali.apk \
              --title "Bharat Ki Thali - Latest Android APK" \
              --notes "Latest Android APK for Bharat Ki Thali. This release is updated automatically from the main branch."
          fi
